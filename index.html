<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>王晓林</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --page-edge-gap: 20px;
            --app-height: 100vh;
            --page-background:
                radial-gradient(circle at left center, rgba(233, 212, 208, 0.32), transparent 28%),
                linear-gradient(180deg, #fffdfb 0%, #ffffff 100%);
            --text-color: #111111;
            --liquid-glass-icon: rgba(56, 64, 79, 0.82);
            --glass-fallback-background: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--page-background);
            min-height: var(--app-height);
            overflow: hidden;
            position: relative;
        }

        .scene {
            position: fixed;
            inset: 0;
        }

        .home-scene {
            z-index: 2;
        }

        .home-layout {
            min-height: var(--app-height);
            display: grid;
            grid-template-columns: 48vw 52vw;
            align-items: stretch;
        }

        .rose-panel {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 48vw;
            top: var(--page-edge-gap);
            height: calc(var(--app-height) - var(--page-edge-gap));
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: visible;
            z-index: 3;
        }

        .rose {
            --rose-x: -12%;
            --rose-y: 0px;
            width: auto;
            max-width: none;
            height: min(calc(var(--app-height) - (var(--page-edge-gap) * 2)), 60vw);
            display: block;
            overflow: visible;
            transform: translateX(var(--rose-x)) translateY(var(--rose-y));
            filter: drop-shadow(0 18px 38px rgba(128, 72, 74, 0.1));
            user-select: none;
            pointer-events: none;
        }

        .content {
            grid-column: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            min-height: var(--app-height);
            width: 100%;
            padding: 17vh 8vw 0 2vw;
            text-align: left;
            z-index: 2;
        }

        .quote {
            font-size: 34px;
            line-height: 1.82;
            color: var(--text-color);
            white-space: pre-line;
            letter-spacing: 0.01em;
            font-weight: 300;
            max-width: 12em;
            animation: fadeIn 1s ease-out;
            margin: 0;
            text-align: left;
        }

        .footer-container {
            position: fixed;
            bottom: var(--page-edge-gap);
            right: var(--page-edge-gap);
            z-index: 20;
            animation: fadeIn 1s ease-out;
            cursor: pointer;
        }

        .footer-image {
            width: 80px;
            height: auto;
            opacity: 0.9;
            display: block;
            transition: transform 0.3s;
        }

        .footer-container:hover .footer-image {
            transform: scale(1.1);
        }

        .social-footer {
            position: fixed;
            bottom: var(--page-edge-gap);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 15;
            padding: 12px 18px;
            border-radius: 999px;
            isolation: isolate;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.66) 0%, rgba(255, 255, 255, 0.18) 100%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.08) 48%, rgba(188, 214, 255, 0.18) 100%),
                rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(30px) saturate(230%) brightness(1.04);
            -webkit-backdrop-filter: blur(30px) saturate(230%) brightness(1.04);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.95),
                inset 0 -10px 18px rgba(255, 255, 255, 0.18),
                inset 0 0 0 1px rgba(255, 255, 255, 0.14),
                0 14px 36px rgba(126, 141, 168, 0.2),
                0 3px 10px rgba(255, 255, 255, 0.32);
            opacity: 0;
            visibility: hidden;
            transition:
                transform 0.28s ease-out,
                opacity 0.28s ease-out,
                visibility 0.28s ease-out,
                box-shadow 0.28s ease-out;
        }

        .social-footer::before,
        .social-footer::after,
        .glass-circle-btn::before,
        .glass-circle-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
        }

        .social-footer::before {
            inset: 1.5px;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.92), transparent 24%),
                radial-gradient(circle at 82% 24%, rgba(196, 218, 255, 0.22), transparent 28%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.02) 58%, rgba(170, 201, 255, 0.1) 100%);
            opacity: 0.95;
            z-index: -1;
        }

        .social-footer::after {
            inset: 8px 18px auto;
            height: 16px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0));
            opacity: 0.9;
        }

        .social-footer.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .social-icon {
            width: 22px;
            height: 22px;
            cursor: pointer;
            opacity: 0.82;
            padding: 3px;
            border-radius: 999px;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.32));
            transition:
                transform 0.24s ease,
                opacity 0.24s ease,
                background 0.24s ease,
                box-shadow 0.24s ease;
        }

        .social-icon:hover {
            opacity: 1;
            transform: translateY(-1px) scale(1.08);
            background: rgba(255, 255, 255, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                0 6px 14px rgba(126, 141, 168, 0.16);
        }

        .glass-circle-btn {
            width: var(--glass-btn-size, 36px);
            height: var(--glass-btn-size, 36px);
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            isolation: isolate;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.64) 0%, rgba(255, 255, 255, 0.14) 100%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.06) 48%, rgba(188, 214, 255, 0.18) 100%),
                rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.48);
            backdrop-filter: blur(28px) saturate(240%) brightness(1.04);
            -webkit-backdrop-filter: blur(28px) saturate(240%) brightness(1.04);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.94),
                inset 0 -8px 14px rgba(255, 255, 255, 0.18),
                inset 0 0 0 1px rgba(255, 255, 255, 0.14),
                0 12px 24px rgba(126, 141, 168, 0.18),
                0 2px 8px rgba(255, 255, 255, 0.28);
            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;
        }

        .glass-circle-btn::before {
            inset: 1.5px;
            background:
                radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.92), transparent 34%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.02) 55%, rgba(170, 201, 255, 0.12) 100%);
            opacity: 0.95;
            z-index: -1;
        }

        .glass-circle-btn::after {
            inset: 6px 8px auto;
            height: 11px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0));
            opacity: 0.9;
        }

        .glass-circle-btn:hover {
            transform: translateY(-1px) scale(1.018);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.98),
                inset 0 -10px 18px rgba(255, 255, 255, 0.22),
                inset 0 0 0 1px rgba(255, 255, 255, 0.18),
                0 14px 26px rgba(126, 141, 168, 0.2),
                0 4px 10px rgba(255, 255, 255, 0.34);
        }

        .glass-circle-btn:active {
            transform: translateY(1px) scale(0.96);
        }

        .close-btn {
            --glass-btn-size: 36px;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .glass-close-icon {
            width: 11px;
            height: 11px;
            position: relative;
            opacity: 0.9;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.3));
        }

        .glass-close-icon::before,
        .glass-close-icon::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 1.8px;
            border-radius: 999px;
            background: var(--liquid-glass-icon);
            transform-origin: center;
            translate: -50% -50%;
        }

        .glass-close-icon::before {
            rotate: 45deg;
        }

        .glass-close-icon::after {
            rotate: -45deg;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .image-card {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            flex-direction: column;
        }

        .image-card img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            object-fit: contain;
            display: block;
        }

        .image-card .close-btn {
            top: -34px;
            right: -2px;
            z-index: 1001;
        }

        .image-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            max-width: 100%;
            padding-bottom: 10px;
        }

        .image-carousel img,
        .image-carousel video {
            scroll-snap-align: center;
            flex: 0 0 auto;
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            display: block;
        }

        .image-carousel::-webkit-scrollbar {
            height: 6px;
        }

        .image-carousel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .image-carousel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --page-background:
                    radial-gradient(circle at left center, rgba(109, 49, 55, 0.2), transparent 32%),
                    linear-gradient(180deg, #171719 0%, #101012 100%);
                --text-color: #f2efec;
                --liquid-glass-icon: rgba(242, 242, 247, 0.9);
                --glass-fallback-background: rgba(38, 38, 42, 0.96);
            }

            .rose {
                filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.3));
            }

            .social-footer,
            .glass-circle-btn {
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02)),
                    rgba(30, 30, 34, 0.7);
                border-color: rgba(255, 255, 255, 0.16);
                backdrop-filter: blur(30px) saturate(160%);
                -webkit-backdrop-filter: blur(30px) saturate(160%);
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.16),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.04),
                    0 14px 36px rgba(0, 0, 0, 0.35);
            }

            .social-footer::before,
            .glass-circle-btn::before {
                opacity: 0.12;
            }

            .social-footer::after,
            .glass-circle-btn::after {
                opacity: 0.14;
            }

            .social-icon {
                opacity: 0.92;
                filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.24));
            }

            .social-icon[alt="GitHub"],
            .social-icon[alt="ChatGPT"] {
                filter: brightness(0) invert(1);
            }

            .social-icon:hover,
            .glass-circle-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.2),
                    0 6px 18px rgba(0, 0, 0, 0.3);
            }

            .glass-close-icon {
                filter: none;
            }

            .modal-overlay {
                background: rgba(0, 0, 0, 0.72);
            }
        }

        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .social-footer,
            .glass-circle-btn {
                background: var(--glass-fallback-background);
            }
        }

        @media (min-width: 768px) {
            .image-card .close-btn {
                right: -30px;
                top: -30px;
            }
        }

        @media (max-width: 900px) {
            .home-layout {
                grid-template-columns: 1fr;
                min-height: var(--app-height);
            }

            .rose-panel {
                top: 0;
                width: 58vw;
                height: var(--app-height);
                justify-content: flex-start;
            }

            .rose {
                --rose-x: -18%;
                --rose-y: 10%;
                width: auto;
                height: min(54vh, 520px);
            }

            .content {
                grid-column: 1;
                min-height: var(--app-height);
                width: 100%;
                padding: 10vh 24px 44vh;
                align-items: center;
                text-align: center;
            }

            .quote {
                font-size: 28px;
                max-width: none;
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 640px) {
            .rose-panel {
                width: min(72vw, 340px);
                overflow: visible;
            }

            .rose {
                --rose-x: 4vw;
                width: min(70vw, 320px);
                height: auto;
            }

            .content {
                padding: 9vh 20px 40vh;
            }

            .quote {
                font-size: 24px;
                line-height: 1.78;
                max-width: none;
                text-align: center;
            }

            .social-footer {
                bottom: calc(var(--page-edge-gap) + 90px);
                gap: 10px;
                padding: 11px 16px;
            }

            .social-icon {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>

    <script>
        const root = document.documentElement;
        const body = document.body;
        const footerContainer = document.querySelector('.footer-container');
        const socialFooter = document.querySelector('.social-footer');

        const imageModal = document.getElementById('imageModal');
        const imageContainer = document.getElementById('imageContainer');

        function setAppHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            root.style.setProperty('--app-height', `${viewportHeight}px`);
        }

        function showImageModal(srcOrArray) {
            imageContainer.innerHTML = '';

            if (Array.isArray(srcOrArray)) {
                if (srcOrArray.length === 1) {
                    const img = document.createElement('img');
                    img.src = srcOrArray[0];
                    img.alt = 'Photo';
                    img.id = 'modalImage';
                    imageContainer.appendChild(img);
                } else {
                    const carousel = document.createElement('div');
                    carousel.className = 'image-carousel';

                    srcOrArray.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = 'Photo';
                        img.className = 'carousel-item';
                        carousel.appendChild(img);
                    });

                    imageContainer.appendChild(carousel);
                }
            } else {
                const img = document.createElement('img');
                img.src = srcOrArray;
                img.alt = 'Photo';
                img.id = 'modalImage';
                imageContainer.appendChild(img);
            }

            imageModal.style.display = 'flex';
            imageModal.offsetHeight;
            imageModal.classList.add('active');
        }

        function closeImageModal() {
            imageModal.classList.remove('active');
            window.setTimeout(() => {
                imageModal.style.display = 'none';
                imageContainer.innerHTML = '';
            }, 300);
        }

        // 花苞与花茎分层轻摆；鼠标靠近时略微倾斜，离开后自然回摆。
        function initRose() {
            const sway = document.getElementById('rose-sway');
            const bud = document.getElementById('rose-bud');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const STEM_BASE = { x: 1025, y: 2048 };
            const BUD_BASE = { x: 1024, y: 1660 };
            const FLOWER = { x: 1030, y: 1150, rx: 900, ry: 950 };
            let pointer = null;
            let angle = 0, angleV = 0, budAngle = 0, budV = 0;
            let lastTime = performance.now();

            function frame(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;
                const ctm = pointer ? sway.getScreenCTM() : null;
                const local = pointer && ctm ? new DOMPoint(pointer.x, pointer.y).matrixTransform(ctm.inverse()) : null;
                const near = local ? Math.hypot((local.x - FLOWER.x) / FLOWER.rx, (local.y - FLOWER.y) / FLOWER.ry) : Infinity;

                if (reduceMotion.matches) {
                    angle = budAngle = angleV = budV = 0;
                } else {
                    const t = now / 1000;
                    const lean = near < 1.6 ? Math.max(-1, Math.min(1, (local.x - FLOWER.x) / 900)) * 1.4 : 0;
                    const breeze = Math.sin(t * 0.9) * 0.8 + Math.sin(t * 2.3 + 1.7) * 0.25;
                    const target = breeze + lean;
                    angleV += ((target - angle) * 18 - angleV * 5) * dt;
                    angle += angleV * dt;
                    const budTarget = Math.max(-1.6, Math.min(1.6, (target - angle) * 0.9 + Math.sin(t * 1.3 + 1) * 0.45));
                    budV += ((budTarget - budAngle) * 26 - budV * 4) * dt;
                    budAngle = Math.max(-1.6, Math.min(1.6, budAngle + budV * dt));
                }

                sway.setAttribute('transform', `rotate(${angle.toFixed(3)} ${STEM_BASE.x} ${STEM_BASE.y})`);
                bud.setAttribute('transform', `rotate(${budAngle.toFixed(3)} ${BUD_BASE.x} ${BUD_BASE.y})`);
                requestAnimationFrame(frame);
            }

            window.addEventListener('pointermove', (event) => {
                if (event.pointerType === 'mouse') pointer = { x: event.clientX, y: event.clientY };
            });
            document.documentElement.addEventListener('pointerleave', () => { pointer = null; });
            requestAnimationFrame(frame);
        }

        function bindEvents() {
            footerContainer.addEventListener('click', () => {
                socialFooter.classList.toggle('show');
            });

            imageModal.onclick = (event) => {
                if (event.target === imageModal) {
                    closeImageModal();
                }
            };

            window.addEventListener('resize', setAppHeight);
            window.addEventListener('orientationchange', setAppHeight);
            window.addEventListener('load', setAppHeight);
            window.addEventListener('pageshow', setAppHeight);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', setAppHeight);
            }
        }

        setAppHeight();
        bindEvents();
        initRose();
    </script>
</body>
</html>
